name: Build and security regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix calling
      - run: npm test --prefix calling
      - run: python3 scripts/test-audio-helper.py calling/scripts/whatsapp-audio-setup
      - run: npm audit --prefix calling --audit-level=high
      - run: npm audit --audit-level=high
